<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jatin &amp; Tanvi — Wedding Invitation</title>
  <meta name="description" content="Jatin and Tanvi are getting married on 5th December. Scroll to fly through the celebrations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Theme: matches the generated scenes' ivory backdrop + marigold/maroon palette. */
    :root, .sw-root {
      --sw-bg: #FAEBD0;
      --sw-ink: #5A1420;
      --sw-ink-soft: #7C5A52;
      --sw-accent: #F2A61D;
      --sw-font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
      --sw-font-body: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    // ── Edit the details here ────────────────────────────────────────────────
    // PLACEHOLDERS to confirm: baraat 7:00 PM and wedding 9:00 PM are dummy times.
    // Still to add: hosts' names and an RSVP contact (final section).
    var HOME  = 'W 132, Golf Links, NH 24, Ghaziabad';
    var VENUE = 'Royal Dreams Banquet Hall, Vedanta Farms, NH 24, Ghaziabad';
    var MAP_HOME  = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('W 132, Golf Links, NH 24, Ghaziabad, UP 201002');
    var MAP_VENUE = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Royal Dreams Banquet Hall, Vedanta Farms, NH 24, Ghaziabad, UP 201002');

    mountLetsScroll(document.getElementById('world'), {
      brand: { name: 'Jatin & Tanvi', href: '#top' },
      cta: { label: 'Venue map', href: MAP_VENUE },
      hint: 'scroll to join the celebrations',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'welcome', label: 'Welcome',
          still: 'assets/img/still_1_welcome.jpg', stillMobile: 'assets/img/still_1_welcome-m.jpg',
          clip: 'assets/vid/dive_1_welcome.mp4',   clipMobile: 'assets/vid/dive_1_welcome-m.mp4',
          accent: '#C9A24B', scroll: 1.6, linger: 0.4,
          eyebrow: 'Together with our families',
          title: 'Jatin & Tanvi are getting married.',
          body: 'We would love for you to celebrate with us across two days of colour, music and blessings in Ghaziabad.',
          tags: ['4th & 5th December 2026', 'Ghaziabad'],
        },
        {
          id: 'haldi', label: 'Haldi',
          still: 'assets/img/still_2_haldi.jpg', stillMobile: 'assets/img/still_2_haldi-m.jpg',
          clip: 'assets/vid/dive_2_haldi.mp4',   clipMobile: 'assets/vid/dive_2_haldi-m.mp4',
          accent: '#F2A61D',
          eyebrow: 'Friday, 4th December · 12:00 PM',
          title: 'Haldi, in a shower of marigolds.',
          body: 'Turmeric, petals and plenty of mischief at our home, ' + HOME + '.',
          tags: ['12:00 PM', 'Wear yellow', 'Clothes you can stain'],
        },
        {
          id: 'mehendi', label: 'Mehendi',
          still: 'assets/img/still_3_mehendi.jpg', stillMobile: 'assets/img/still_3_mehendi-m.jpg',
          clip: 'assets/vid/dive_3_mehendi.mp4',   clipMobile: 'assets/vid/dive_3_mehendi-m.mp4',
          accent: '#5E7F4A',
          eyebrow: 'Friday, 4th December · 4:00 PM',
          title: 'Mehendi, stories in every swirl.',
          body: 'An easy afternoon of henna, chai and songs at our home, ' + HOME + '.',
          tags: ['4:00 PM', 'Greens & pinks', 'Festive ethnic'],
        },
        {
          id: 'djnight', label: 'DJ Night',
          still: 'assets/img/still_4_djnight.jpg', stillMobile: 'assets/img/still_4_djnight-m.jpg',
          clip: 'assets/vid/dive_4_djnight.mp4',   clipMobile: 'assets/vid/dive_4_djnight-m.mp4',
          accent: '#E58FA3',
          eyebrow: 'Friday, 4th December · 6:00 PM',
          title: 'DJ Night. Bring your best moves.',
          body: 'The dance floor opens at six and nobody sits this one out, at our home, ' + HOME + '.',
          tags: ['6:00 PM', 'Glam & glitter', 'Dancing shoes'],
        },
        {
          id: 'baraat', label: 'Baraat',
          still: 'assets/img/still_5_baraat.jpg', stillMobile: 'assets/img/still_5_baraat-m.jpg',
          clip: 'assets/vid/dive_5_baraat.mp4',   clipMobile: 'assets/vid/dive_5_baraat-m.mp4',
          accent: '#C9A24B',
          eyebrow: 'Saturday, 5th December · 7:00 PM',
          title: 'The baraat arrives.',
          body: 'Dhol, dancing and one very happy groom on the way to ' + VENUE + '.',
          tags: ['7:00 PM', 'Sherwanis & safas', 'Jewel tones'],
        },
        {
          id: 'wedding', label: 'The Wedding',
          still: 'assets/img/still_6_wedding.jpg', stillMobile: 'assets/img/still_6_wedding-m.jpg',
          clip: 'assets/vid/dive_6_wedding.mp4',   clipMobile: 'assets/vid/dive_6_wedding-m.mp4',
          accent: '#7A1F2B', scroll: 1.8, linger: 0.5,
          eyebrow: 'Saturday, 5th December · 9:00 PM',
          title: 'Two families, one mandap.',
          body: 'Join us for the pheras and dinner at ' + VENUE + '. Your presence is the only gift we need.',
          tags: ['9:00 PM', 'Traditional Indian', 'Pastels, gold & jewel tones'],
          cta: { primary:   { label: 'Wedding venue map', href: MAP_VENUE },
                 secondary: { label: 'Haldi · Mehendi · DJ venue', href: MAP_HOME } },
        },
      ],
      // Connector clips are not rendered yet: null = the engine crossfades scene to scene.
      // When they exist, list assets/vid/conn_1.mp4 … conn_5.mp4 here and
      // assets/vid/conn_1-m.mp4 … conn_5-m.mp4 in connectorsMobile.
      connectors: [null, null, null, null, null],
      connectorsMobile: ['assets/vid/conn_1-m.mp4', 'assets/vid/conn_2-m.mp4', 'assets/vid/conn_3-m.mp4', 'assets/vid/conn_4-m.mp4', 'assets/vid/conn_5-m.mp4'],
    });

</body>
</html>
